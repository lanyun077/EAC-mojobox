name: 校验贡献与构建

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 复核自制包清单与归档字节
        run: node authoring/build.mjs --check
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /dsh-mojobox/
      - name: 独立读取并校验下载归档
        run: npm run verify:downloads
      - run: npm run build:demo
      - run: npm run verify:downloads -- dist-demo --allow-demo
