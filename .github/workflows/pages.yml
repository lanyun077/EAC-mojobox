name: 发布静态目录

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.MOJOBOX_STATIC_HOST != 'cloudflare'
    concurrency:
      group: mojobox-static-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: 发布前校验归档
        run: npm run verify:downloads
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: 从已合并 PR 采集投稿者
        run: node scripts/contributors.mjs dist/generated --github
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
